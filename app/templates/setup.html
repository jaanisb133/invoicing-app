<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Uzņēmuma iestatīšana — V-Rēķini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&subset=latin-ext&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=6">
    <script>(function(){var t=localStorage.getItem('vrekini-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
        }
        .setup-container {
            width: 100%;
            max-width: 620px;
        }
        .setup-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .setup-header .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 16px;
        }
        .setup-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .setup-header p {
            font-size: 14px;
            color: var(--text-light);
            margin: 0;
        }
        .setup-step {
            font-size: 12px;
            color: var(--text-lighter);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <div class="logo">VR</div>
            <h1>Laipni lūdzam!</h1>
            <p>Aizpildiet uzņēmuma informāciju, lai sāktu lietot sistēmu.</p>
        </div>

        <form method="post" action="/setup">
            <div class="card">
                <div class="card-header">Uzņēmuma informācija</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Vārds / Uzņēmuma nosaukums *</label>
                        <input type="text" name="company_name" class="form-control"
                               value="{{ display_name or '' }}" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Reģistrācijas numurs</label>
                            <input type="text" name="reg_number" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Juridiskā adrese</label>
                            <input type="text" name="legal_address" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <div style="margin-top:4px">
                            <label style="font-weight:400;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px">
                                <input type="hidden" name="is_vat_payer" value="0">
                                <input type="checkbox" id="vatPayerToggle" name="is_vat_payer" value="1"
                                       checked
                                       onchange="document.getElementById('vatFields').style.display=this.checked?'':'none'"
                                       style="width:18px;height:18px;cursor:pointer">
                                Esmu PVN maksātājs
                            </label>
                            <span style="font-size:12px;color:var(--text-light)">
                                Ja neesat PVN maksātājs, PVN aprēķini un lauks netiks rādīti dokumentos
                            </span>
                        </div>
                    </div>
                    <div id="vatFields">
                        <div class="form-row">
                            <div class="form-group">
                                <label>PVN numurs</label>
                                <input type="text" name="vat_number" class="form-control" placeholder="LV...">
                            </div>
                            <div class="form-group">
                                <label>PVN likme (%)</label>
                                <input type="text" name="default_vat_rate" class="form-control" value="21">
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Banka</label>
                            <input type="text" name="bank_name" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Bankas konts</label>
                            <input type="text" name="bank_account" class="form-control">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Rēķinu numerācija</div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Numerācijas tips</label>
                        <div class="number-type-options">
                            <label class="radio-card selected">
                                <input type="radio" name="invoice_number_type" value="type1" checked
                                       onchange="updateSetupPreview()">
                                <div class="radio-card-content">
                                    <strong>Tips 1 — Gads + numurs</strong>
                                    <span class="radio-card-example">26-001, 26-002, ...</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="invoice_number_type" value="type2"
                                       onchange="updateSetupPreview()">
                                <div class="radio-card-content">
                                    <strong>Tips 2 — Numurs/diena-mēnesis</strong>
                                    <span class="radio-card-example">01/09-03, 02/09-03, ...</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="invoice_number_type" value="type3"
                                       onchange="updateSetupPreview()">
                                <div class="radio-card-content">
                                    <strong>Tips 3 — Vienkāršs numurs</strong>
                                    <span class="radio-card-example">001, 002, 003, ...</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    <div id="setupType1Options">
                        <div class="form-row">
                            <div class="form-group" id="setupSepGroup">
                                <label>Atdalītājs</label>
                                <input type="text" name="invoice_number_separator" id="setupSep" class="form-control"
                                       value="-" maxlength="3" style="max-width:100px" oninput="updateSetupPreview()">
                            </div>
                            <div class="form-group">
                                <label>Minimālais ciparu skaits</label>
                                <select name="invoice_number_digits" id="setupDigits" class="form-control"
                                        style="max-width:100px" onchange="updateSetupPreview()">
                                    <option value="2">2 (01)</option>
                                    <option value="3" selected>3 (001)</option>
                                    <option value="4">4 (0001)</option>
                                    <option value="5">5 (00001)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="preview-box" id="setupPreview">
                        <strong>Piemērs:</strong> <span id="setupPreviewText">...</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;font-size:15px;padding:14px 28px">
                Sākt lietot V-Rēķini
            </button>
        </form>
    </div>

    <script>
    function updateSetupPreview() {
        const type = document.querySelector('input[name="invoice_number_type"]:checked').value;
        const sep = document.getElementById('setupSep').value;
        const digits = parseInt(document.getElementById('setupDigits').value) || 3;

        const opts = document.getElementById('setupType1Options');
        const sepGroup = document.getElementById('setupSepGroup');
        opts.style.display = (type === 'type2') ? 'none' : '';
        sepGroup.style.display = (type === 'type3') ? 'none' : '';

        document.querySelectorAll('.radio-card').forEach(c => c.classList.remove('selected'));
        document.querySelector('input[name="invoice_number_type"]:checked').closest('.radio-card').classList.add('selected');

        const y = new Date().getFullYear() % 100;
        const d = String(new Date().getDate()).padStart(2, '0');
        const m = String(new Date().getMonth() + 1).padStart(2, '0');

        let preview = '';
        if (type === 'type1') {
            const n1 = '1'.padStart(digits, '0');
            const n2 = '2'.padStart(digits, '0');
            preview = `${y}${sep}${n1}, ${y}${sep}${n2}, ...`;
        } else if (type === 'type2') {
            preview = `01/${d}-${m}, 02/${d}-${m}, ... (katru dienu no jauna)`;
        } else {
            const n1 = '1'.padStart(digits, '0');
            const n2 = '2'.padStart(digits, '0');
            preview = `${n1}, ${n2}, ...`;
        }
        document.getElementById('setupPreviewText').textContent = preview;
    }
    updateSetupPreview();
    </script>
</body>
</html>
