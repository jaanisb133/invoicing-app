{% extends "auth_base.html" %}
{% block title %}Licences aktivizēšana | V-Rēķini{% endblock %}
{% block content %}
<h1>Licences aktivizēšana</h1>
<p class="sub">Ievadiet licences atslēgu, lai turpinātu.</p>
{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/license">
    <div class="f">
        <label for="licKey">Licences atslēga</label>
        <input type="text" id="licKey" name="license_key" class="input license-key" placeholder="VREK-XXXX-XXXX-XXXX"
               required autofocus autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <button type="submit" class="btn btn-wide">Aktivizēt</button>
</form>
{% endblock %}
