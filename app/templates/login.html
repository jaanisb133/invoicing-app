<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Pieslēgties — V-Rēķini</title>
    <meta name="description" content="Pieslēdzieties savam V-Rēķini kontam, lai pārvaldītu rēķinus un klientus.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://v-rekini.lv/login">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="stylesheet" href="/static/css/style.css?v=18">
    <script>(function(){var t=localStorage.getItem('vrekini-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.10) 0%, rgba(59, 130, 246, 0) 60%);
            pointer-events: none;
            z-index: 0;
        }
        .login-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .login-brand-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--brand) 0%, #2563EB 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }
        .login-brand-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
        .login-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-card h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--text); letter-spacing: -0.4px; text-align: center; }
        .login-card .subtitle { font-size: 14px; color: var(--text-light); margin: 0 0 24px; text-align: center; }
        .login-card .btn-primary { width: 100%; padding: 12px 16px; font-size: 14px; margin-top: 8px; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-light); }
        .login-footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    {% include "_public_navbar.html" %}
    <div class="login-wrap">
    <div class="login-container">
        <div class="login-brand">
            <div class="login-brand-logo">VR</div>
            <div class="login-brand-name">V-Rēķini</div>
        </div>
        <div class="login-card">
            <h1>Laipni lūdzam atpakaļ</h1>
            <p class="subtitle">Pieslēdzieties savam kontam</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if message %}
            <div class="alert alert-success">{{ message }}</div>
            {% endif %}

            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">E-pasts</label>
                    <input type="text" id="username" name="username" class="form-control"
                           value="{{ username or '' }}" required autofocus autocomplete="username" placeholder="jusu@epasts.lv">
                </div>
                <div class="form-group">
                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" class="form-control"
                           required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">Pieslēgties</button>
            </form>
            <div class="login-footer">
                Nav konta? <a href="/register">Reģistrēties</a>
            </div>
        </div>
    </div>
    </div>
    {% include "_public_footer.html" %}
</body>
</html>
