<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieslēgties — Pavadzīmju Pārvaldnieks</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 40px 32px;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--primary);
        }
        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 28px;
        }
        .login-card .btn-primary {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Pavadzīmju Pārvaldnieks</h1>
            <p class="subtitle">Lūdzu, pieslēdzieties</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if message %}
            <div class="alert alert-success">{{ message }}</div>
            {% endif %}

            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">Lietotājvārds</label>
                    <input type="text" id="username" name="username" class="form-control"
                           value="{{ username or '' }}" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" class="form-control"
                           required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Pieslēgties</button>
            </form>
        </div>
    </div>
</body>
</html>
