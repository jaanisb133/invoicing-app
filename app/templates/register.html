<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reģistrēties — Pavadzīmju Pārvaldnieks</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .login-container { width: 100%; max-width: 440px; padding: 20px; }
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
        .login-card .subtitle { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
        .login-card .btn-primary { width: 100%; padding: 10px 16px; font-size: 14px; margin-top: 8px; }
        .login-footer { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-light); }
        .login-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Izveidot kontu</h1>
            <p class="subtitle">Sāciet pārvaldīt savus rēķinus</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register">
                <div class="form-group">
                    <label for="display_name">Vārds / Uzņēmuma nosaukums</label>
                    <input type="text" id="display_name" name="display_name" class="form-control"
                           value="{{ display_name or '' }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">E-pasts</label>
                    <input type="email" id="email" name="email" class="form-control"
                           value="{{ email or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="username">Lietotājvārds</label>
                    <input type="text" id="username" name="username" class="form-control"
                           value="{{ username or '' }}" required pattern="[a-zA-Z0-9_.]+"
                           title="Tikai burti, cipari, _ un .">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Parole</label>
                        <input type="password" id="password" name="password" class="form-control"
                               required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Apstiprināt paroli</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                               required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Reģistrēties</button>
            </form>
            <div class="login-footer">
                Jau ir konts? <a href="/login">Pieslēgties</a>
            </div>
        </div>
    </div>
</body>
</html>
