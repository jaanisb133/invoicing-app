{# Shared <head> tail for public pages on site.css #}
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css?v={{ css_version }}">
    <script>
    (function () {
        var d = document.documentElement; d.classList.add('js');
        try { var t = localStorage.getItem('vrekini-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
    })();
    </script>
