<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Iestatīt paroli — V-Rēķini</title>
    <link rel="stylesheet" href="/static/css/style.css?v=16">
    <script>(function(){var t=localStorage.getItem('vrekini-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.10) 0%, rgba(59, 130, 246, 0) 60%);
            pointer-events: none;
            z-index: 0;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .login-brand-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--brand) 0%, #2563EB 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }
        .login-brand-name { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
        .login-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-card h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--text); letter-spacing: -0.4px; text-align: center; }
        .login-card .subtitle { font-size: 14px; color: var(--text-light); margin: 0 0 24px; text-align: center; }
        .login-card .btn-primary { width: 100%; padding: 12px 16px; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <div class="login-brand-logo">VR</div>
            <div class="login-brand-name">V-Rēķini</div>
        </div>
        <div class="login-card">
            <h1>Iestatīt paroli</h1>
            <p class="subtitle">Sveiki, {{ display_name }}! Lūdzu, iestatiet jaunu paroli.</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" action="/set-password">
                <div class="form-group">
                    <label for="new_password">Jaunā parole</label>
                    <input type="password" id="new_password" name="new_password" class="form-control"
                           required autofocus minlength="6" autocomplete="new-password" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Apstiprināt paroli</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                           required minlength="6" autocomplete="new-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">Saglabāt paroli</button>
            </form>
        </div>
    </div>
</body>
</html>
