<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Iestatīt paroli — V-Rēķini</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>(function(){var t=localStorage.getItem('vrekini-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 40px 32px;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--primary);
        }
        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 28px;
        }
        .login-card .btn-primary {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Iestatīt paroli</h1>
            <p class="subtitle">Sveiki, {{ display_name }}! Lūdzu, iestatiet jaunu paroli.</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" action="/set-password">
                <div class="form-group">
                    <label for="new_password">Jaunā parole</label>
                    <input type="password" id="new_password" name="new_password" class="form-control"
                           required autofocus minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Apstiprināt paroli</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                           required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Saglabāt paroli</button>
            </form>
        </div>
    </div>
</body>
</html>
