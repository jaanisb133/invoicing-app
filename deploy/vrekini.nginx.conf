# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name v-rekini.lv www.v-rekini.lv;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name v-rekini.lv www.v-rekini.lv;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/v-rekini.lv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v-rekini.lv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (for logo uploads etc.)
    client_max_body_size 10M;

    # Static files — served directly by nginx for performance
    location /static/ {
        alias /opt/vrekini/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
